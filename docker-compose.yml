services:
  postgres:
    image: postgres:16-alpine
    container_name: ase-postgres
    environment:
      POSTGRES_USER: ase
      POSTGRES_PASSWORD: ase
      POSTGRES_DB: ase
    ports:
      - "5432:5432"
    volumes:
      - ase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ase -d ase"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ase-redis
    ports:
      - "6379:6379"
    volumes:
      - ase_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ase_postgres_data:
  ase_redis_data:
